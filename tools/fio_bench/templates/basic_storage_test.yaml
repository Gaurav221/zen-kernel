name: basic_storage_test
description: Sequential and random I/O baseline — good starting point for any device
output_dir: ./fio_results

global_fio:
  filename: /tmp/fio_testfile
  size: 1g
  ioengine: libaio
  direct: 1
  time_based: 1
  runtime: 30
  numjobs: 1
  group_reporting: 1

steps:
  - name: collect_system_info
    type: command
    description: Snapshot system state before testing
    enabled: true
    commands:
      - cmd: uname -r
        label: kernel_version
        sudo: false
        timeout: 10
        ignore_errors: false
      - cmd: lsblk -o NAME,SIZE,TYPE,ROTA,SCHED,MODEL
        label: block_devices
        sudo: false
        timeout: 10
        ignore_errors: false
      - cmd: cat /proc/cpuinfo | grep 'model name' | head -1
        label: cpu_model
        sudo: false
        timeout: 10
        ignore_errors: false
      - cmd: free -h
        label: memory
        sudo: false
        timeout: 10
        ignore_errors: false

  - name: seq_read_128k
    type: fio
    description: Sequential read — peak throughput
    enabled: true
    fio:
      rw: read
      bs: 128k
      iodepth: 32
      numjobs: 4

  - name: seq_write_128k
    type: fio
    description: Sequential write — peak throughput
    enabled: true
    fio:
      rw: write
      bs: 128k
      iodepth: 32
      numjobs: 4

  - name: rand_read_4k
    type: fio
    description: Random 4k read — IOPS and latency
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 64
      numjobs: 4

  - name: rand_write_4k
    type: fio
    description: Random 4k write — IOPS and latency
    enabled: true
    fio:
      rw: randwrite
      bs: 4k
      iodepth: 64
      numjobs: 4

  - name: collect_iostat_final
    type: command
    description: Capture I/O scheduler stats after testing
    enabled: true
    commands:
      - cmd: iostat -x 1 5
        label: iostat
        sudo: false
        timeout: 30
        ignore_errors: true
