name: latency_profile
description: Sweep queue depths to profile latency vs IOPS trade-off
output_dir: ./fio_results

global_fio:
  filename: /tmp/fio_testfile
  size: 4g
  ioengine: libaio
  direct: 1
  time_based: 1
  runtime: 30
  numjobs: 1
  group_reporting: 1

steps:
  - name: pre_info
    type: command
    description: System state snapshot
    enabled: true
    commands:
      - cmd: uname -r
        label: kernel_version
        timeout: 10
        ignore_errors: false
      - cmd: cat /sys/block/*/queue/scheduler 2>/dev/null || true
        label: io_schedulers
        timeout: 10
        ignore_errors: true
      - cmd: cat /sys/block/*/queue/nr_requests 2>/dev/null || true
        label: queue_depth
        timeout: 10
        ignore_errors: true

  - name: latency_qd1
    type: fio
    description: Baseline latency at queue depth 1 (no queuing overhead)
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 1
      numjobs: 1

  - name: latency_qd4
    type: fio
    description: Latency at queue depth 4
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 4
      numjobs: 1

  - name: latency_qd16
    type: fio
    description: Latency/IOPS balance at queue depth 16
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 16
      numjobs: 1

  - name: latency_qd64
    type: fio
    description: High IOPS target at queue depth 64
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 64
      numjobs: 1

  - name: latency_qd256
    type: fio
    description: Saturation test at queue depth 256
    enabled: true
    fio:
      rw: randread
      bs: 4k
      iodepth: 256
      numjobs: 1

  - name: post_iostat
    type: command
    description: Disk utilization after tests
    enabled: true
    commands:
      - cmd: iostat -x 1 3
        label: iostat
        timeout: 30
        ignore_errors: true
